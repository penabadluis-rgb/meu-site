name: Scan Docker com Trivy
on:
  push:
    branches: [ "main" ]
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build imagem v3
        run: docker build -t meu-site:v3 .
      - name: Scan Trivy - falha se tiver HIGH ou CRITICAL
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: 'meu-site:v3'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'